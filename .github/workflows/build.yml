name: Automated Android Build and Test Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Application and Run Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Check out Repository Source Code
      uses: actions/checkout@v4

    - name: Initialize Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradle Wrapper Script
      run: chmod +x gradlew

    - name: Execute Local Unit Test Suites
      run: ./gradlew testDebugUnitTest --stacktrace

    - name: Assemble Debug Package Artifact
      run: ./gradlew assembleDebug --stacktrace

    - name: Persist Generated APK Deliverable
      uses: actions/upload-artifact@v4
      with:
        name: impilo23-prototype-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
